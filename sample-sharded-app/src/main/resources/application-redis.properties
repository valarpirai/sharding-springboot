# MySQL + Redis Profile - Alternative Database Configuration
# This profile switches from PostgreSQL to MySQL for all databases

# Global Database - MySQL
app.sharding.global-db.url=jdbc:mysql://localhost:3306/global_db
app.sharding.global-db.driver-class-name=com.mysql.cj.jdbc.Driver

# Shard 1 Configuration - MySQL
app.sharding.shards.shard1.master.url=jdbc:mysql://localhost:3306/shard1_db
app.sharding.shards.shard1.master.driver-class-name=com.mysql.cj.jdbc.Driver

app.sharding.shards.shard1.replicas.replica1.url=jdbc:mysql://localhost:3307/shard1_db
app.sharding.shards.shard1.replicas.replica1.driver-class-name=com.mysql.cj.jdbc.Driver

app.sharding.shards.shard1.replicas.replica2.url=jdbc:mysql://localhost:3308/shard1_db
app.sharding.shards.shard1.replicas.replica2.driver-class-name=com.mysql.cj.jdbc.Driver

# Shard 2 Configuration - MySQL
app.sharding.shards.shard2.master.url=jdbc:mysql://localhost:3309/shard2_db
app.sharding.shards.shard2.master.driver-class-name=com.mysql.cj.jdbc.Driver

app.sharding.shards.shard2.replicas.replica1.url=jdbc:mysql://localhost:3310/shard2_db
app.sharding.shards.shard2.replicas.replica1.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis Cache Configuration Overrides
app.sharding.cache.ttl-hours=1
app.sharding.cache.redis-key-prefix=sharding:tenant:
app.sharding.cache.redis-connection-timeout-ms=2000
app.sharding.cache.record-stats=true